name: repkg
run-name: "Repkg ( ${{github.event.inputs.pkg-name}} ${{github.event.inputs.pkg-version}})"
on:
  workflow_dispatch:
    inputs:
      pkg-name:
        description: 'repkg candidate'
        required: true
      pkg-version:
        description: 'repkg candidate version'
        required: true

jobs:
  Bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ___X_CMD_PKG_CANDADITE: ${{github.event.inputs.pkg-name}}
      ___X_CMD_PKG_CANDADITE_VERSION: ${{github.event.inputs.pkg-version}}
      ___X_CMD_GHACTION_X: x6
      WEBHOOK_URL: ${{ secrets.ROBOT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}
      git_user: agent-zero
      git_email: 0@x-cmd.com
      CONCURRENCY: 10
    steps:
      - name: main
        uses: x-cmd/action@main
        with:
          code: |
            x ws repkg_pregare
            cd .tmp/repkg || return $?
            x ws ci "$___X_CMD_PKG_CANDADITE" "$___X_CMD_PKG_CANDADITE_VERSION" || return $?

